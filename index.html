<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;

            background: #ffffff;

            padding: 40px 30px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .success {
            width: 75px;
            height: 75px;

            background: #22c55e;
            color: white;

            border-radius: 50%;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .description {
            color: #666;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .code-box {
            background: #f1f5f9;

            border-radius: 10px;

            padding: 15px;

            margin-bottom: 25px;
        }

        .code-label {
            font-size: 12px;

            color: #777;

            margin-bottom: 5px;
        }

        #accessCode {
            font-size: 20px;

            font-weight: bold;

            letter-spacing: 1px;

            word-break: break-all;
        }

        .instagram-button {
            display: block;

            width: 100%;

            padding: 16px;

            background: #E1306C;

            color: white;

            text-decoration: none;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;

            transition: 0.2s;
        }

        .instagram-button:hover {
            opacity: 0.9;

            transform: translateY(-1px);
        }

        .note {
            margin-top: 15px;

            font-size: 12px;

            color: #999;

            line-height: 1.5;
        }

        .error {
            color: #dc2626;

            background: #fee2e2;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="card">

    <!-- SUCCESS -->

    <div class="success">
        ✓
    </div>


    <!-- TITLE -->

    <h1>
        Thank You! 🎉
    </h1>


    <p class="description">
        Your payment has been completed successfully.
        <br>
        Your full video is ready to access.
    </p>


    <!-- ACCESS CODE -->

    <div class="code-box">

        <div class="code-label">
            YOUR ACCESS CODE
        </div>

        <div id="accessCode">
            Loading...
        </div>

    </div>


    <!-- ERROR -->

    <div
        id="errorMessage"
        class="error"
        style="display:none;"
    >
        Access code missing.
    </div>


    <!-- INSTAGRAM BUTTON -->

    <a
        id="instagramButton"
        class="instagram-button"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
    >
        📩 Get Full Video on Instagram
    </a>


    <p class="note">
        Tap the button to open Instagram and message us.
        Send your access code to receive your full video.
    </p>

</div>


<script>

    /*
    ==================================================
    INSTAGRAM USERNAME
    ==================================================

    Apna Instagram username yahan daalo.

    Example:

    const instagramUsername = "myvideopage";

    */

    const instagramUsername = "choreographerdiamond";


    /*
    ==================================================
    GET ACCESS CODE FROM URL
    ==================================================

    Example:

    https://yourdomain.com/thank-you.html?code=VIDEO_A72K

    */

    const params = new URLSearchParams(
        window.location.search
    );

    const accessCode = params.get("code");


    /*
    ==================================================
    CHECK ACCESS CODE
    ==================================================
    */

    if (!accessCode) {

        document.getElementById("accessCode")
            .innerText = "Not Available";

        document.getElementById("errorMessage")
            .style.display = "block";

        document.getElementById("instagramButton")
            .style.display = "none";

    } else {

        /*
        Show access code
        */

        document.getElementById("accessCode")
            .innerText = accessCode;


        /*
        ==================================================
        INSTAGRAM PROFILE / DM URL
        ==================================================

        Instagram DM link:

        https://ig.me/m/USERNAME

        */

        const instagramURL =
            "https://ig.me/m/" +
            instagramUsername;


        /*
        Set Instagram button
        */

        document.getElementById("instagramButton")
            .href = instagramURL;

    }

</script>

</body>
</html>
